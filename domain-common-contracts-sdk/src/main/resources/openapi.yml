components:
  schemas:
    ContractDocumentIssuedEvidence:
      type: object
      properties:
        issuanceId:
          type: string
          nullable: true
        documentId:
          type: string
          nullable: true
        documentVersionId:
          type: string
          nullable: true
        versionNumber:
          type: integer
          format: int32
          nullable: true
        mediaType:
          type: string
          nullable: true
        byteLength:
          type: integer
          format: int64
          nullable: true
        contentDigest:
          type: string
          nullable: true
        factsDigest:
          type: string
          nullable: true
        receiptDigest:
          type: string
          nullable: true
    ContractDocumentOperation:
      type: object
      properties:
        operationId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        contractId:
          type: string
          nullable: true
        actionId:
          type: string
          nullable: true
        phase:
          type: string
          nullable: true
          enum:
          - RESERVED
          - READY
          - ISSUED_PENDING_ATTACHMENT
          - ATTACHED
        intent:
          $ref: "#/components/schemas/ContractDocumentPrepareRequest"
        sourceRevision:
          type: integer
          format: int64
          nullable: true
        coreSnapshotDigest:
          type: string
          nullable: true
        sealedRequestDigest:
          type: string
          nullable: true
        factsDigest:
          type: string
          nullable: true
        issued:
          $ref: "#/components/schemas/ContractDocumentIssuedEvidence"
        attachmentId:
          type: string
          nullable: true
        createdAtEpochMillis:
          type: integer
          format: int64
          nullable: true
        createdBy:
          type: string
          nullable: true
        sealedAtEpochMillis:
          type: integer
          format: int64
          nullable: true
        sealedBy:
          type: string
          nullable: true
        recordedAtEpochMillis:
          type: integer
          format: int64
          nullable: true
        recordedBy:
          type: string
          nullable: true
        attachedAtEpochMillis:
          type: integer
          format: int64
          nullable: true
        attachedBy:
          type: string
          nullable: true
    ContractDocumentPins:
      type: object
      properties:
        bindingId:
          type: string
          nullable: true
        bindingStateVersion:
          type: integer
          format: int64
          nullable: true
        revisionId:
          type: string
          nullable: true
        sourceDigest:
          type: string
          nullable: true
    ContractDocumentPrepareRequest:
      type: object
      properties:
        actionId:
          type: string
          nullable: true
        expectedContractRevision:
          type: integer
          format: int64
          nullable: true
        selection:
          $ref: "#/components/schemas/ContractDocumentSelection"
        expected:
          $ref: "#/components/schemas/ContractDocumentPins"
        contractDocumentTypeId:
          type: string
          nullable: true
        productVersionReferences:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ContractProductVersionReference"
        retention:
          $ref: "#/components/schemas/ContractDocumentRetention"
        displayName:
          type: string
          nullable: true
        predecessorOperationId:
          type: string
          nullable: true
    ContractDocumentRetention:
      type: object
      properties:
        policyCode:
          type: string
          nullable: true
        policyVersion:
          type: string
          nullable: true
        retainUntilEpochMillis:
          type: integer
          format: int64
          nullable: true
    ContractDocumentSelection:
      type: object
      properties:
        documentPurpose:
          type: string
          nullable: true
        productScope:
          type: string
          nullable: true
          enum:
          - NONE
          - EXACT
        productId:
          type: string
          nullable: true
        channelCode:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        localeCode:
          type: string
          nullable: true
        businessAtEpochMillis:
          type: integer
          format: int64
          nullable: true
    ContractProductVersionReference:
      type: object
      properties:
        productId:
          type: string
          nullable: true
        productVersionId:
          type: string
          nullable: true
    GovernedContractDocumentIntent:
      type: object
      properties:
        actionId:
