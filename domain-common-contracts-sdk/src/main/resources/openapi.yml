openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Governed Contract Documents
  description: Exact CONTRACT_DOCUMENT_V1 issuance and current-authority recovery
- name: Contract Parties
  description: Contract party management operations
- name: Contracts
  description: Contract management operations
- name: Contract Terms
  description: Contract terms management operations
- name: Contract Signatures
  description: Contract signature operations
- name: Contract Documents
  description: Contract document management operations
paths:
  /api/v1/tenants/{tenantId}/contracts/{contractId}/governed-documents/{actionId}/resume:
    post:
      tags:
      - Governed Contract Documents
      summary: Resume the exact retained action under current authority
      operationId: resumeGovernedContractDocument
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContractDocumentOperation"
      x-disable-idempotency: true
  /api/v1/tenants/{tenantId}/contracts/{contractId}/governed-documents:
    post:
      tags:
      - Governed Contract Documents
      summary: Issue and attach an exact governed contract action
      operationId: issueGovernedContractDocument
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernedContractDocumentIntent"
        required: true
      responses:
        "200":
          description: Current retained journal state; issued evidence is never deleted
            as compensation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContractDocumentOperation"
      x-disable-idempotency: true
  /api/v1/kit-documents:
    post:
      tags:
      - kit-documents-controller
      summary: Legacy document issue requires migration
      description: Always returns 409. Use a governed document intent with an actual
        contract and action identity.
      operationId: issue
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Compatibility header; this route does not cache responses or
          derive authority from it.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueBody"
        required: true
      responses:
        "200":
          description: Historical schema retained for client compatibility; current
            calls return409.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedId"
        "409":
          description: GOVERNED_DOCUMENT_INTENT_REQUIRED
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedId"
      deprecated: true
      x-disable-idempotency: true
  /api/v1/contracts:
    post:
      tags:
